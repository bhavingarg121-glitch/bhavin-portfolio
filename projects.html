<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Hub | Bhavin Garg</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
max-width:900px;
}

h1{
font-size:42px;
margin-bottom:10px;
}

p{
color:#94a3b8;
margin-bottom:40px;
}

.cards{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}

.card{
width:280px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
padding:25px;
border-radius:16px;
cursor:pointer;
transition:0.3s;
text-decoration:none;
color:white;
}

.card:hover{
transform:translateY(-10px);
background:rgba(255,255,255,0.1);
}

.icon{
font-size:50px;
}

.btn{
display:inline-block;
margin-top:15px;
padding:10px 15px;
background:#4f6ef7;
border-radius:8px;
color:white;
}

</style>

</head>

<body>

<div class="container">

<h1>🚀 Project Hub</h1>
<p>Select a project to explore full details</p>

<div class="cards">

<a class="card" href="schemesathi.html">
<div class="icon">🧠</div>
<h2>SchemeSathi</h2>
<p>Government scheme discovery platform</p>
<div class="btn">Open Project</div>
</a>

<a class="card" href="netscope.html">
<div class="icon">📡</div>
<h2>NetScope India</h2>
<p>Internet speed test & telecom analytics</p>
<div class="btn">Open Project</div>
</a>

</div>

</div>

</body>
