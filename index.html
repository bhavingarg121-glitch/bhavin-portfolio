<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bhavin Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    .active-link { border-bottom: 2px solid #fff; }
  </style>
</head>
<body class="font-sans text-gray-800">

<!-- Navbar -->
<nav class="fixed top-0 left-0 w-full bg-blue-900 text-white shadow-md z-50">
  <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-3">
    <h1 class="font-bold text-lg">Bhavin</h1>
    <ul class="hidden md:flex space-x-6" id="navbar">
      <li><a href="about.html" class="hover:text-gray-300">About</a></li>
      <li><a href="projects.html" class="hover:text-gray-300">Projects</a></li>
      <li><a href="resume.html" class="hover:text-gray-300">Resume</a></li>
      <li><a href="contact.html" class="hover:text-gray-300">Contact</a></li>
    </ul>
    <button id="menu-btn" class="md:hidden focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>
  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden bg-blue-800 px-6 pb-4">
    <ul class="flex flex-col space-y-4">
      <li><a href="about.html" class="hover:text-gray-300">About</a></li>
      <li><a href="projects.html" class="hover:text-gray-300">Projects</a></li>
      <li><a href="resume.html" class="hover:text-gray-300">Resume</a></li>
      <li><a href="contact.html" class="hover:text-gray-300">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- Hero Section -->
<header class="bg-blue-900 text-white text-center py-32 mt-20" data-aos="fade-up">
  <h1 class="text-4xl font-bold">Hi, I'm Bhavin</h1>
  <p class="mt-4 text-lg">Building scalable solutions with code</p>
  <div class="mt-6 space-x-4">
    <a href="projects.html" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded transition">View Projects</a>
    <a href="Resume.docx" download class="bg-white text-blue-900 hover:bg-gray-200 px-6 py-2 rounded transition">Download Resume</a>
  </div>
</header>

<!-- Footer -->
<footer class="bg-blue-900 text-white text-center py-6" data-aos="fade-up">
  <p>© 2026 Bhavin Garg</p>
</footer>

<!-- AOS JS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ duration: 1000, once: true });
  const menuBtn = document.getElementById("menu-btn");
  const mobileMenu = document.getElementById("mobile-menu");
  menuBtn.addEventListener("click", () => {
    mobileMenu.classList.toggle("hidden");
  });
</script>
</body>
</html>
