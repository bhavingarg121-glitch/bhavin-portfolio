<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bhavin Garg | Cinematic Intro</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Background City */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url('https://i.imgur.com/3ZQ3Z6H.jpg') no-repeat center/cover;
  animation: zoomBg 6s ease-in-out forwards;
}

/* Zoom Effect */
@keyframes zoomBg {
  0% { transform: scale(1); }
  100% { transform: scale(1.2); }
}

/* Rope */
.rope {
  position: absolute;
  top: 0;
  left: 50%;
  width: 2px;
  height: 0;
  background: white;
  animation: ropeDrop 1s ease-out forwards;
}

@keyframes ropeDrop {
  to { height: 280px; }
}

/* Spider-Man */
.spiderman {
  position: absolute;
  top: -250px;
  left: 50%;
  transform: translateX(-50%);
  width: 130px;
  animation: swing 3s ease-in-out forwards;
}

@keyframes swing {
  0% {
    top: -250px;
    transform: translateX(-50%) rotate(-25deg);
  }
  50% {
    top: 300px;
    transform: translateX(-50%) rotate(25deg);
  }
  100% {
    top: 180px;
    transform: translateX(-50%) rotate(0deg);
  }
}

/* Name */
.name {
  position: absolute;
  bottom: 100px;
  width: 100%;
  text-align: center;
  font-size: 55px;
  color: white;
  opacity: 0;
  letter-spacing: 4px;
  animation: fadeIn 2s ease forwards;
  animation-delay: 3s;
}

/* Subtitle */
.subtitle {
  position: absolute;
  bottom: 50px;
  width: 100%;
  text-align: center;
  font-size: 20px;
  color: #ccc;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
  animation-delay: 4s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Cinematic Fade Overlay */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  opacity: 1;
  animation: fadeOut 2s ease forwards;
  animation-delay: 0.5s;
}

@keyframes fadeOut {
  to { opacity: 0; }
}

</style>
</head>

<body>

<!-- Cinematic Fade -->
<div class="overlay"></div>

<!-- Background -->
<div class="bg"></div>

<!-- Rope -->
<div class="rope"></div>

<!-- Spider-Man -->
<img src="https://i.imgur.com/6RLdC6O.png" class="spiderman">

<!-- Name -->
<div class="name">BHAVIN GARG</div>

<!-- Subtitle -->
<div class="subtitle">Web Developer | CSE Student</div>

<!-- Sounds -->
<audio id="swingSound" src="https://www.fesliyanstudios.com/play-mp3/4386"></audio>
<audio id="boomSound" src="https://www.fesliyanstudios.com/play-mp3/387"></audio>

<script>

/* Play Sounds */
window.onload = () => {
  const swing = document.getElementById("swingSound");
  const boom = document.getElementById("boomSound");

  // slight delay for realism
  setTimeout(() => {
    swing.play();
  }, 800);

  setTimeout(() => {
    boom.play();
  }, 3000);
};

</script>

</body>
</html>
