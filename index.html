<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bhavin Garg | Portfolio</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  /* Intro Section */
  .intro {
    position: relative;
    height: 100vh;
    width: 100%;
  }

  /* Rope */
  .rope {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 0;
    background: white;
    transform-origin: top;
    animation: ropeDrop 1s ease-out forwards;
  }

  @keyframes ropeDrop {
    to {
      height: 250px;
    }
  }

  /* Spider-Man */
  .spiderman {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%) rotate(0deg);
    width: 120px;
    animation: swing 2.5s ease-in-out forwards;
  }

  @keyframes swing {
    0% {
      top: -200px;
      transform: translateX(-50%) rotate(-20deg);
    }
    50% {
      top: 250px;
      transform: translateX(-50%) rotate(20deg);
    }
    100% {
      top: 150px;
      transform: translateX(-50%) rotate(0deg);
    }
  }

  /* Name Text */
  .name {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
    font-size: 50px;
    color: white;
    opacity: 0;
    letter-spacing: 3px;
    animation: fadeIn 2s ease forwards;
    animation-delay: 2.5s;
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
    }
  }

  /* Subtext */
  .subtitle {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    font-size: 18px;
    color: #aaa;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 3.5s;
  }

</style>
</head>

<body>

<div class="intro">

  <!-- Rope -->
  <div class="rope"></div>

  <!-- Spider-Man Image -->
  <!-- Replace with your own spiderman.png -->
  <img src="https://i.imgur.com/6RLdC6O.png" class="spiderman">

  <!-- Name -->
  <div class="name">BHAVIN GARG</div>

  <!-- Subtitle -->
  <div class="subtitle">Web Developer | CSE Student</div>

</div>

</body>
</html>
