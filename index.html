<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhavin Garg | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0b0f14;
  color: #e5e7eb;
}

/* GRID BACKGROUND */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 50px 50px;
  z-index: -1;
}

/* INTRO */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
}

#nameIntro {
  font-size: 60px;
  color: red;
  letter-spacing: 10px;
}

/* SPIDERMAN */
#spiderman {
  position: absolute;
  width: 120px;
  transform-origin: top center;
}

#rope {
  position: absolute;
  width: 2px;
  background: white;
  top: 0;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
  border-bottom: 1px solid #222;
}

/* HERO */
.hero {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 50px;
  padding: 80px 20px;
}

.profile {
  width: 200px;
  border-radius: 10px;
}

/* SECTION */
.section {
  max-width: 1000px;
  margin: 60px auto;
  padding: 30px;
  background: #111827;
  border-radius: 12px;
  opacity: 0;
}

/* CHATBOT */
#chatbot {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 260px;
  background: #111;
  border-radius: 10px;
}

#chat-body {
  height: 150px;
  overflow-y: auto;
  padding: 10px;
}

#chat-input {
  width: 100%;
  padding: 8px;
  background: #222;
  color: white;
  border: none;
}

#voiceBtn {
  width: 100%;
  padding: 10px;
  background: #2563eb;
  border: none;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1 id="nameIntro">BHAVIN GARG</h1>
  <div id="rope"></div>
  <img src="images/spiderman.png" id="spiderman">
</div>

<nav>
  <div><b>Bhavin</b></div>
  <div>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<section class="hero">
  <img src="images/profile1.jpg" class="profile">
  <div>
    <h1>Bhavin Garg</h1>
    <p>AI Enthusiast | Developer</p>
  </div>
</section>

<section id="about" class="section">
  <h2>About</h2>
  <p>Computer Science student passionate about building real-world AI solutions.</p>
</section>

<section id="projects" class="section">
  <h2>Projects</h2>
  <p>Government Schemes Information Platform (In Progress)</p>
</section>

<section id="contact" class="section">
  <h2>Contact</h2>
  <p>Email: bhavingarg121@gmail.com</p>
</section>

<!-- CHATBOT -->
<div id="chatbot">
  <div id="chat-body"></div>
  <input id="chat-input" placeholder="Ask me...">
  <button id="voiceBtn">🎙️ Talk</button>
</div>

<script>

// INTRO ANIMATION
gsap.from("#nameIntro",{scale:0.5,opacity:0,duration:1.5});

let spider=document.getElementById("spiderman");
let rope=document.getElementById("rope");

gsap.set(spider,{x:window.innerWidth/2,y:-200});
gsap.set(rope,{left:window.innerWidth/2});

gsap.to(spider,{y:200,duration:1.5});
gsap.to(spider,{rotation:30,duration:1,yoyo:true,repeat:3});
gsap.to(rope,{height:250,duration:1.5});

setTimeout(()=>{
 gsap.to("#intro",{opacity:0,duration:1});
 setTimeout(()=>document.getElementById("intro").style.display="none",1000);
},4000);

// SCROLL ANIMATIONS
gsap.registerPlugin(ScrollTrigger);
gsap.utils.toArray(".section").forEach(sec=>{
 gsap.to(sec,{
  opacity:1,
  y:-30,
  duration:1,
  scrollTrigger:{trigger:sec,start:"top 80%"}
 });
});

// CHATBOT + VOICE (IMPORTANT: replace URL)
const API_URL="https://your-app.onrender.com/chat";

const input=document.getElementById("chat-input");
const body=document.getElementById("chat-body");

input.addEventListener("keypress",async e=>{
 if(e.key==="Enter"){
  let msg=input.value;
  add("You: "+msg);

  const res=await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg})
  });

  const data=await res.json();
  let reply=data.choices[0].message.content;

  add("AI: "+reply);
  speak(reply);
  input.value="";
 }
});

function add(msg){
 let d=document.createElement("div");
 d.textContent=msg;
 body.appendChild(d);
 body.scrollTop=body.scrollHeight;
}

// VOICE
const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
document.getElementById("voiceBtn").onclick=()=>rec.start();

rec.onresult=async e=>{
 let speech=e.results[0][0].transcript;
 add("You: "+speech);

 const res=await fetch(API_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({message:speech})
 });

 const data=await res.json();
 let reply=data.choices[0].message.content;

 add("AI: "+reply);
 speak(reply);
};

function speak(t){
 let s=new SpeechSynthesisUtterance(t);
 speechSynthesis.speak(s);
}

</script>

</body>
</html>
