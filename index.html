<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhavin Garg | AI Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body {
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0b0f14;
  color:#e5e7eb;
}

/* HERO */
.hero {
  text-align:center;
  padding:80px 20px;
}
.profile {
  width:150px;
  border-radius:10px;
}

.section {
  max-width:900px;
  margin:40px auto;
  padding:30px;
  background:rgba(255,255,255,0.05);
  border-radius:10px;
}

/* CHAT */
#chatbot {
  position:fixed;
  bottom:20px;
  right:20px;
  width:280px;
  background:#111;
  border-radius:10px;
}
#chat-body {
  height:200px;
  overflow:auto;
  padding:10px;
}
#chat-input {
  width:100%;
  padding:10px;
  background:#222;
  color:white;
  border:none;
}
#voiceBtn {
  width:100%;
  padding:10px;
  background:#2563eb;
  color:white;
  border:none;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="images/profile1.jpg" class="profile">
  <h1>Bhavin Garg</h1>
  <p>AI Developer | Problem Solver</p>
</section>

<!-- ABOUT -->
<section class="section">
  <h2>About Me</h2>
  <p>
    I am a Computer Science Engineering student working on Scheme Sathi, 
    a platform to help people discover government schemes.
  </p>
</section>

<!-- CHATBOT -->
<div id="chatbot">
  <div id="chat-body"></div>
  <input id="chat-input" placeholder="Ask me anything...">
  <button id="voiceBtn">🎙️ Talk</button>
</div>

<script>
const API_URL = "http://127.0.0.1:5000/chat"; // local backend

// TEXT CHAT
document.getElementById("chat-input").addEventListener("keypress", async e => {
  if (e.key === "Enter") {
    let msg = e.target.value;
    add("You: " + msg);

    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: msg})
    });

    const data = await res.json();
    let reply = data.reply || "Error";

    add("AI: " + reply);
    speak(reply);

    e.target.value = "";
  }
});

// ADD MESSAGE
function add(msg){
  let d = document.createElement("div");
  d.textContent = msg;
  document.getElementById("chat-body").appendChild(d);
}

// VOICE
const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

document.getElementById("voiceBtn").onclick = () => rec.start();

rec.onresult = async e => {
  let speech = e.results[0][0].transcript;
  add("You: " + speech);

  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:speech})
  });

  const data = await res.json();
  let reply = data.reply;

  add("AI: " + reply);
  speak(reply);
};

// SPEAK
function speak(text){
  let s = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(s);
}
</script>

</body>
</html>
