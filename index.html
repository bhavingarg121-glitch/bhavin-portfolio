<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO -->
<meta name="description" content="Bhavin Garg - CSE student skilled in DSA, Python and development. Creator of Scheme Sathi.">
<meta name="keywords" content="Bhavin Garg, Portfolio, DSA, Python">
<meta name="author" content="Bhavin Garg">
<meta name="robots" content="index, follow">

<title>Bhavin Garg | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0b0f14;
  color:#e5e7eb;
}

/* LOADER */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#0b0f14;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
#loader h1{
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{opacity:0.5;}
  to{opacity:1;text-shadow:0 0 20px #3b82f6;}
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:100%;height:100%;
  background:
  linear-gradient(rgba(255,255,255,0.05)1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,0.05)1px,transparent 1px);
  background-size:50px 50px;
  z-index:-2;
}

/* NAV */
nav{
  position:sticky;top:0;
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:rgba(0,0,0,0.6);
}

/* HERO */
.hero{text-align:center;padding:80px 20px;}
.profile{
  width:160px;height:160px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 20px #3b82f6;
}
.hero h1{
  background:linear-gradient(90deg,#3b82f6,#9333ea);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* CARDS */
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.card{
  padding:20px;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  transition:0.4s;
}
.card:hover{
  transform:scale(1.05) rotateX(5deg);
}

/* SECTION */
.section{
  max-width:1000px;
  margin:60px auto;
  padding:40px;
  background:rgba(255,255,255,0.04);
  border-radius:16px;
}

/* CHATBOT */
#chatbot{
  position:fixed;
  bottom:20px;
  right:20px;
  width:300px;
  height:420px;
  background:#111;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  transition:0.3s;
}
#chatbot.hide{
  transform:scale(0.8);
  opacity:0;
  pointer-events:none;
}

#chat-header{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#222;
}
#chat-body{
  flex:1;
  overflow:auto;
  padding:10px;
}
.msg{padding:10px;border-radius:10px;margin:5px;}
.user{background:#2563eb;text-align:right;}
.ai{background:#333;}

#chatIcon{
  position:fixed;
  bottom:20px;
  right:20px;
  width:55px;height:55px;
  background:#2563eb;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  display:none;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader"><h1>Bhavin Garg</h1></div>

<!-- NAV -->
<nav>
<h2>Bhavin</h2>
<div>
<a href="#about">About</a>
<a href="#projects">Projects</a>
<a href="#contact">Contact</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<img src="images/profile1.jpg" class="profile">
<h1>Bhavin Garg</h1>
<p>Building real-world solutions using DSA</p>

<div class="cards">
<div class="card">💻 Developer</div>
<div class="card">🤖 AI Enthusiast</div>
<div class="card">⚡ Fast Learner</div>
</div>
</section>

<section id="about" class="section">
<h2>About</h2>
<p>I am working on Scheme Sathi project.</p>
</section>

<section id="projects" class="section">
<h2>Projects</h2>
<p>Scheme Sathi</p>
</section>

<section id="contact" class="section">
<h2>Contact</h2>
<p><a href="mailto:bhavingarg121@gmail.com">Email</a></p>
<p><a href="https://linkedin.com" target="_blank">LinkedIn</a></p>
</section>

<!-- CHAT -->
<div id="chatbot">
<div id="chat-header">🤖 AI <button id="minBtn">➖</button></div>
<div id="chat-body"></div>
<input id="chat-input">
<button id="voiceBtn">🎙️</button>
</div>

<div id="chatIcon">💬</div>

<footer class="footer">
© 2026 Bhavin Garg
</footer>

<script>

// LOADER
window.onload=()=>{
 setTimeout(()=>document.getElementById("loader").style.display="none",1500);
};

// CHAT AI
function reply(m){
m=m.toLowerCase();
if(m.includes("hi")) return "Hey 👋";
if(m.includes("project")) return "Scheme Sathi";
return "Ask about skills or projects!";
}

// CHAT
chatInput.onkeypress=e=>{
if(e.key==="Enter"){
let m=chatInput.value;
chatInput.value="";
chatBody.innerHTML+=`<div class="msg user">${m}</div>`;
setTimeout(()=>chatBody.innerHTML+=`<div class="msg ai">${reply(m)}</div>`,500);
}
};

// MINIMIZE
minBtn.onclick=()=>{
chatbot.classList.add("hide");
chatIcon.style.display="flex";
};
chatIcon.onclick=()=>{
chatbot.classList.remove("hide");
chatIcon.style.display="none";
};

</script>

</body>
</html>
