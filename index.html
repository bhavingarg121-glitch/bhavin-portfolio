<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO -->
<meta name="description" content="Bhavin Garg Portfolio - CSE student, DSA, Python, Projects">
<meta name="keywords" content="Bhavin Garg, Portfolio, DSA, Python">
<meta name="author" content="Bhavin Garg">

<title>Bhavin Garg | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0b0f14;
  color:#e5e7eb;
}

/* LOADER */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#0b0f14;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#loader h1{
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{opacity:0.5;}
  to{opacity:1;text-shadow:0 0 20px #3b82f6;}
}

/* BACKGROUND GRID */
body::before{
  content:"";
  position:fixed;
  width:100%;height:100%;
  background:
  linear-gradient(rgba(255,255,255,0.05)1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,0.05)1px,transparent 1px);
  background-size:50px 50px;
  z-index:-2;
}

/* NAV */
nav{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  padding:15px 30px;
  background:rgba(0,0,0,0.6);
}
nav a{color:white;margin-left:20px;text-decoration:none;}

/* HERO */
.hero{text-align:center;padding:80px 20px;}
.profile{
  width:160px;height:160px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 0 20px #3b82f6;
  cursor:pointer;
  transition:0.3s;
}
.profile:hover{transform:scale(1.05);}

.hero h1{
  background:linear-gradient(90deg,#3b82f6,#9333ea);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* CARDS */
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.card{
  padding:20px;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  transition:0.4s;
}
.card:hover{
  transform:scale(1.05) rotateX(5deg);
}

/* SECTION */
.section{
  max-width:1000px;
  margin:60px auto;
  padding:40px;
  background:rgba(255,255,255,0.04);
  border-radius:16px;
}

/* CHATBOT */
#chatbot{
  position:fixed;
  bottom:20px;
  right:20px;
  width:300px;
  height:420px;
  background:rgba(17,17,17,0.9);
  backdrop-filter:blur(10px);
  border-radius:12px;
  display:flex;
  flex-direction:column;
  transition:0.4s;
}

#chatbot.minimized{
  height:60px;
  opacity:0.6;
}

#chat-header{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:rgba(0,0,0,0.6);
}

#chat-body{
  flex:1;
  overflow:auto;
  padding:10px;
}

.msg{
  padding:10px;
  border-radius:10px;
  margin:5px;
}
.user{background:#2563eb;text-align:right;}
.ai{background:#333;}

#chat-input{
  padding:10px;
  border:none;
  background:#222;
  color:white;
}

/* IMAGE VIEWER */
#imageViewer{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:0.4s;
}
#imageViewer.show{
  opacity:1;
  pointer-events:auto;
}
#imageViewer img{
  max-width:90%;
  max-height:90%;
}
#closeImg{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:white;
  cursor:pointer;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader"><h1>Bhavin Garg</h1></div>

<!-- NAV -->
<nav>
<h2>Bhavin</h2>
<div>
<a href="#about">About</a>
<a href="#projects">Projects</a>
<a href="#contact">Contact</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<img src="profile1.jepg" id="profileImg" class="profile">
<h1>Bhavin Garg</h1>
<p>Building real-world solutions using DSA</p>

<div class="cards">
<div class="card">💻 Developer</div>
<div class="card">🤖 AI Enthusiast</div>
<div class="card">⚡ Fast Learner</div>
</div>
</section>

<section id="about" class="section">
<h2>About</h2>
<p>I am working on Scheme Sathi project.</p>
</section>

<section id="projects" class="section">
<h2>Projects</h2>
<p>Scheme Sathi</p>
</section>

<section id="contact" class="section">
<h2>Contact</h2>
<p><a href="mailto:bhavingarg121@gmail.com">Email</a></p>
<p><a href="https://linkedin.com" target="_blank">LinkedIn</a></p>
</section>

<!-- CHATBOT -->
<div id="chatbot">
<div id="chat-header">🤖 AI <button id="minBtn">➖</button></div>
<div id="chat-body"></div>
<input id="chat-input" placeholder="Ask something...">
</div>

<!-- IMAGE VIEW -->
<div id="imageViewer">
<span id="closeImg">&times;</span>
<img id="fullImg">
</div>

<footer class="footer">
© 2026 Bhavin Garg
</footer>

<script>

// LOADER
window.onload=()=>{
 setTimeout(()=>document.getElementById("loader").style.display="none",1500);
};

// SMART CHATBOT
function getReply(msg){
 msg=msg.toLowerCase();

 if(msg.includes("hi")) return "Hey 👋 How are you?";
 if(msg.includes("how are you")) return "I'm doing great! 😊 What about you?";
 if(msg.includes("who are you")) return "I'm Bhavin's AI assistant 🤖";
 if(msg.includes("project")) return "He is working on Scheme Sathi.";
 if(msg.includes("skills")) return "DSA, Python, C programming.";
 if(msg.includes("goal")) return "To work at top MNCs.";

 return "That's interesting 🤔 Tell me more!";
}

// CHAT
chatInput.onkeypress=e=>{
 if(e.key==="Enter"){
  let m=chatInput.value;
  chatInput.value="";
  chatBody.innerHTML+=`<div class="msg user">${m}</div>`;

  setTimeout(()=>{
    chatBody.innerHTML+=`<div class="msg ai">${getReply(m)}</div>`;
  },500);
 }
};

// MINIMIZE (TRANSPARENT)
minBtn.onclick=()=>{
 chatbot.classList.toggle("minimized");
};

// IMAGE VIEW
profileImg.onclick=()=>{
 fullImg.src=profileImg.src;
 imageViewer.classList.add("show");
};

closeImg.onclick=()=>{
 imageViewer.classList.remove("show");
};

</script>

</body>
</html>
