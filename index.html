<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhavin Garg | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0b0f14;
  color: #fff;
}

/* INTRO */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 9999;
  overflow: hidden;
}

/* SPIDERMAN */
#spiderman {
  position: absolute;
  top: 0;
  left: 50%;
  width: 120px;
  transform: translateX(-50%);
}

/* ROPE */
#rope {
  position: absolute;
  width: 2px;
  height: 150px;
  background: white;
  left: 50%;
}

/* BATMAN */
#batman {
  position: absolute;
  bottom: -200px;
  left: 10%;
  width: 140px;
  opacity: 0;
}

/* NAME */
#nameIntro {
  position: absolute;
  top: 50%;
  width: 100%;
  text-align: center;
  font-size: 60px;
  color: red;
  opacity: 0;
}

/* MAIN SITE */
.hero {
  text-align: center;
  padding: 100px 20px;
}

.profile {
  width: 180px;
  border-radius: 10px;
}

.section {
  max-width: 900px;
  margin: 40px auto;
  padding: 30px;
  background: #111827;
  border-radius: 10px;
}

/* CHAT */
#chatbot {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 260px;
  background: #111;
}

#chat-body {height:150px;overflow:auto;padding:10px;}
#chat-input {width:100%;padding:8px;background:#222;color:white;border:none;}
#voiceBtn {width:100%;padding:10px;background:#2563eb;color:white;border:none;}

</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div id="rope"></div>
  <img src="images/spiderman.png" id="spiderman">
  <img src="images/batman.png" id="batman">
  <h1 id="nameIntro">BHAVIN GARG</h1>
</div>

<!-- MAIN -->
<section class="hero">
  <img src="images/profile1.jpg" class="profile">
  <h1>Bhavin Garg</h1>
  <p>AI Developer | Problem Solver</p>
</section>

<section class="section">
  <h2>About</h2>
  <p>I build AI-powered and real-world tech solutions.</p>
</section>

<section class="section">
  <h2>Projects</h2>
  <p>Government Schemes Platform</p>
</section>

<section class="section">
  <h2>Contact</h2>
  <p>Email: bhavingarg121@gmail.com</p>
</section>

<!-- CHAT -->
<div id="chatbot">
  <div id="chat-body"></div>
  <input id="chat-input">
  <button id="voiceBtn">🎙️ Talk</button>
</div>

<script>

/* 🎬 CINEMATIC FLOW */
let tl = gsap.timeline();

// spider drop + swing
tl.from("#spiderman", {y:-200, duration:1})
.to("#spiderman", {rotation:25, repeat:3, yoyo:true});

// batman entry
tl.to("#batman", {bottom:50, opacity:1, duration:1});

// name reveal
tl.to("#nameIntro", {opacity:1, scale:1.2, duration:1});

// exit intro
tl.to("#intro", {opacity:0, duration:1, delay:1})
.set("#intro", {display:"none"});

/* 🤖 AI CHAT (FIXED) */
const API_URL = "https://your-app.onrender.com/chat";

document.getElementById("chat-input").addEventListener("keypress", async e=>{
 if(e.key==="Enter"){
  let msg=e.target.value;
  add("You: "+msg);

  const res=await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg})
  });

  const data=await res.json();

  // 🔥 FIX (important)
  let reply = data.choices ? data.choices[0].message.content : "Error connecting AI";

  add("AI: "+reply);
  speak(reply);

  e.target.value="";
 }
});

function add(msg){
 let d=document.createElement("div");
 d.textContent=msg;
 document.getElementById("chat-body").appendChild(d);
}

/* 🎙️ VOICE */
const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
document.getElementById("voiceBtn").onclick=()=>rec.start();

rec.onresult=async e=>{
 let speech=e.results[0][0].transcript;
 add("You: "+speech);

 const res=await fetch(API_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({message:speech})
 });

 const data=await res.json();
 let reply = data.choices[0].message.content;

 add("AI: "+reply);
 speak(reply);
};

function speak(t){
 let s=new SpeechSynthesisUtterance(t);
 speechSynthesis.speak(s);
}

</script>

</body>
</html>
