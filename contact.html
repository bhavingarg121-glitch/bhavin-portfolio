<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Bhavin Garg</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h2 {
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .column {
      flex: 1;
      min-width: 250px;
    }

    .contact-section {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin: 15px 0;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2),
                  0 0 15px rgba(255,255,255,0.3);
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .contact-section:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 25px rgba(0,0,0,0.25),
                  0 0 20px rgba(255,255,255,0.5);
    }

    .contact-section h3 {
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }

    .contact-section a {
      text-decoration: none;
      color: #f0f0f0;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
    }

    .contact-section a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h2>Contact Me</h2>
  </header>

  <div class="container">
    <!-- Left Column -->
    <div class="column">
      <div class="contact-section">
        <h3>Email</h3>
        <a href="mailto:bhavingarg121@gmail.com">bhavingarg121@gmail.com</a>
      </div>

      <div class="contact-section">
        <h3>GitHub</h3>
        <a href="https://github.com/your_github_username" target="_blank">github.com/your_github_username</a>
      </div>

      <div class="contact-section">
        <h3>LinkedIn</h3>
        <a href="https://www.linkedin.com/in/bhavin-garg" target="_blank">linkedin.com/in/bhavin-garg</a>
      </div>
    </div>

    <!-- Right Column -->
    <div class="column">
      <div class="contact-section">
        <h3>Instagram</h3>
        <a href="https://www.instagram.com/your_instagram_username" target="_blank">@your_instagram_username</a>
      </div>

      <div class="contact-section">
        <h3>Contact No</h3>
        <a href="tel:+916006103292">+91-6006103292</a>
      </div>

      <div class="contact-section">
        <h3>WhatsApp</h3>
        <a href="https://wa.me/916006103292?text=Hey%20Bhavin" target="_blank">Message on WhatsApp</a>
      </div>
    </div>
  </div>
</body>
</html>
