<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Bhavin Garg</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
    }

    header {
      background: #0077b5; /* LinkedIn blue */
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-toggle {
      font-size: 24px;
      cursor: pointer;
      display: none;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }
      nav {
        display: none;
        flex-direction: column;   /* stack links vertically */
        background: #0077b5;
        width: 100%;
        padding: 10px;
      }
      nav a {
        padding: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.3);
      }
      nav.active {
        display: flex;
      }
    }

    .contact-links {
      padding: 20px;
      text-align: center;
    }
    .contact-links a {
      display: block;
      margin: 10px 0;
      text-decoration: none;
      color: #0077b5;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h2>Contact Me</h2>
    <span class="menu-toggle">&#9776;</span>
    <nav>
      <a href="https://wa.me/916006103292?text=Hey%20Bhavin" target="_blank">WhatsApp</a>
      <a href="https://www.linkedin.com/in/bhavin-garg" target="_blank">LinkedIn</a>
      <a href="https://www.instagram.com/your_instagram_username" target="_blank">Instagram</a>
      <a href="https://github.com/your_github_username" target="_blank">GitHub</a>
      <a href="mailto:bhavingarg121@gmail.com">Email</a>
      <a href="tel:+916006103292">Call</a>
    </nav>
  </header>

  <div class="contact-links">
    <p>Select an option above to connect with me.</p>
  </div>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });
  </script>
</body>
</html>
