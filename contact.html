<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Bhavin Garg</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
    }

    header {
      background: #0077b5; /* LinkedIn blue */
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-toggle {
      font-size: 24px;
      cursor: pointer;
      display: none;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }
      nav {
        display: none;
        flex-direction: column;   /* stack vertically */
        background: #0077b5;
        width: 100%;
      }
      nav.active {
        display: flex;
      }
      .contact-section {
        background: #f5f7fa;
        margin: 10px;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
      }
      .contact-section h3 {
        margin-bottom: 8px;
        color: #0077b5;
      }
      .contact-section a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }
    }
  </style>
</head>
<body>
  <header>
    <h2>Contact Me</h2>
    <span class="menu-toggle">&#9776;</span>
    <nav>
      <div class="contact-section">
        <h3>Email</h3>
        <a href="mailto:bhavingarg121@gmail.com">bhavingarg121@gmail.com</a>
      </div>
      <div class="contact-section">
        <h3>GitHub</h3>
        <a href="https://github.com/your_github_username" target="_blank">github.com/your_github_username</a>
      </div>
      <div class="contact-section">
        <h3>LinkedIn</h3>
        <a href="https://www.linkedin.com/in/bhavin-garg" target="_blank">linkedin.com/in/bhavin-garg</a>
      </div>
      <div class="contact-section">
        <h3>Contact No</h3>
        <a href="tel:+916006103292">+91-6006103292</a>
      </div>
      <div class="contact-section">
        <h3>WhatsApp</h3>
        <a href="https://wa.me/916006103292?text=Hey%20Bhavin" target="_blank">Message on WhatsApp</a>
      </div>
    </nav>
  </header>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('nav');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('active');
    });
  </script>
</body>
</html>
